<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LẤY KEY CHÍNH THỨC</title>
    <style>
        *{margin:0; padding:0; box-sizing:border-box; font-family:system-ui,sans-serif;}
        body{background:linear-gradient(135deg,#1e3a2f,#0f766e); color:#e0f2fe; min-height:100vh; padding:15px;}
        .container{max-width:420px; margin:0 auto;}
        .bao-tri-screen{display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(10,40,30,.97); z-index:999; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px;}
        .bao-tri-box{background:rgba(20,70,50,.9); padding:30px 25px; border-radius:16px; border:2px solid #ff6b6b; max-width:400px;}
        .icon{font-size:40px; margin-bottom:10px;}
        .bao-tri-box h2{color:#ff6b6b; font-size:20px; margin-bottom:10px;}
        .ket-noi{color:#facc15; font-size:12px; margin-top:10px;}
        .ver{text-align:center; color:#5eead4; font-size:14px; font-weight:600; margin-bottom:15px; padding:8px; background:rgba(20,255,200,.08); border-radius:10px;}
        .hop{background:rgba(25,80,60,.85); padding:20px; border-radius:16px; border:2px solid rgba(94,234,212,.3); margin-top:10px;}
        .tieude{color:#5eead4; font-size:18px; font-weight:700; text-align:center; margin-bottom:12px;}
        .key-homnay{background:rgba(15,60,45,.9); padding:15px; border-radius:10px; text-align:center; font-family:monospace; font-size:20px; font-weight:bold; color:#bef264; margin:10px 0; letter-spacing:2px;}
        .btn{width:100%; padding:12px; border:none; border-radius:10px; font-weight:700; cursor:pointer; font-size:16px;}
        .btn-xanh{background:linear-gradient(135deg,#10b981,#34d399); color:#fff;}
        .btn-copy{background:linear-gradient(135deg,#84cc16,#a3e635); color:#0f172a; margin-top:8px;}
        .thongbao{color:#86efac; margin-top:10px; display:none; text-align:center; padding:8px; background:rgba(74,222,128,.1); border-radius:8px;}
        .nut-admin{background:linear-gradient(135deg,#ef4444,#b91c1c); color:#fff; border:none; width:100%; padding:10px; border-radius:10px; font-size:15px; font-weight:600; cursor:pointer; margin-top:15px;}
        .khung-admin{background:rgba(239,68,68,.15); border:2px solid #ef4444; padding:12px; border-radius:10px; margin-top:15px; display:none;}
        .khung-admin.hien{display:block;}
        input{width:100%; padding:12px; background:rgba(15,45,35,.8); border:2px solid rgba(52,211,153,.4); color:#5eead4; border-radius:10px; font-size:16px; text-align:center; outline:none; font-family:monospace; text-transform:uppercase; margin-bottom:12px;}
    </style>
</head>
<body>
    <div class="container">
        <div class="bao-tri-screen" id="manHinhBaoTri">
            <div class="bao-tri-box">
                <div class="icon">🔧</div>
                <h2>ĐANG BẢO TRÌ</h2>
                <p>App đang được bảo trì<br>Vui lòng chờ mở lại!</p>
                <div class="ket-noi" id="trangThaiKetNoi">⚡ Kết nối máy chủ...</div>
            </div>
        </div>
        <div id="manHinhChinh">
            <div class="ver">v1.0.0</div>
            <div class="hop">
                <div class="tieude">🔑 KEY MỞ TẤT CẢ</div>
                <div class="key-homnay" id="keyHomNay"></div>
                <button class="btn btn-copy" onclick="saoChepKey()">📋 SAO CHÉP KEY</button>
                <div class="thongbao" id="daChep">✅ Đã sao chép!</div>

                <button class="nut-admin" onclick="document.getElementById('khungAdmin').classList.toggle('hien')">🔐 TRUNG TÂM ADMIN</button>
                <div class="khung-admin" id="khungAdmin">
                    <p style="color:#fca5a5; margin-bottom:8px;"><b>Nhập Key Admin → vào Quản Lý</b></p>
                    <input type="text" id="nhapAdmin" placeholder="Nhập Key Admin">
                    <button class="btn" style="background:#b91c1c; color:#fff; margin-top:8px;" onclick="vaoTrangAdmin()">🔓 VÀO QUẢN LÝ</button>
                </div>
            </div>
        </div>
    </div>

<script>
// ===== THAY MÃ BẢNG TÍNH CỦA BẠN VÀO ĐÂY =====
const MA_BANG_TINH = "1YgjvxtzT2mvOmqlVZemQ26eC2HSI7gDIiGey3HtQHWg";
const APP_DANG_KY = "APP1";
// =============================================

let dangBiKhoa = false;

// === Đọc trạng thái từ máy chủ ===
async function kiemTraMayChu(){
    try{
        const url = `https://docs.google.com/spreadsheets/d/${MA_BANG_TINH}/gviz/tq?tqx=out:json`;
        const res = await fetch(url);
        const text = await res.text();
        const duLieu = JSON.parse(text.slice(47, -2));
        const hang = duLieu.table.rows.find(r => r.c[0]?.v === APP_DANG_KY);
        const trangthai = hang?.c[1]?.v || "MO";
        
        document.getElementById('trangThaiKetNoi').textContent = trangthai === 'KHOA' ? '✅ Đã kết nối — ĐANG BẢO TRÌ' : '✅ Đã kết nối — HOẠT ĐỘNG';
        
        if(trangthai === 'KHOA' && !dangBiKhoa){
            dangBiKhoa = true;
            document.getElementById('manHinhBaoTri').style.display='flex';
            document.getElementById('manHinhChinh').style.display='none';
        }
        else if(trangthai !== 'KHOA' && dangBiKhoa){
            dangBiKhoa = false;
            document.getElementById('manHinhBaoTri').style.display='none';
            document.getElementById('manHinhChinh').style.display='block';
        }
    }catch(e){
        document.getElementById('trangThaiKetNoi').textContent = '❌ Mất kết nối';
    }
}
setInterval(kiemTraMayChu, 10000);

// === Key hôm nay ===
function layKeyHomNay(){
    const d=new Date(),n=String(d.getDate()).padStart(2,'0'),t=String(d.getMonth()+1).padStart(2,'0'),y=String(d.getFullYear()).slice(-2);
    return`FF${n}${t}${y}VN`;
}
function saoChepKey(){
    navigator.clipboard.writeText(layKeyHomNay());
    document.getElementById('daChep').style.display='block';
    setTimeout(()=>document.getElementById('daChep').style.display='none',2500);
}

// === Key Admin ===
function layKeyAdmin(){
    const d=new Date(),n=String(d.getDate()).padStart(2,'0'),t=String(d.getMonth()+1).padStart(2,'0'),y=String(d.getFullYear()).slice(-2);
    return`ADMINFF${n}${t}${y}VN`;
}
function vaoTrangAdmin(){
    const nhap = document.getElementById('nhapAdmin').value.toUpperCase().trim();
    if(nhap === layKeyAdmin()){ window.location.href = 'admin.html'; }
    else { alert('❌ Sai Key Admin!'); }
}

window.onload=function(){
    document.getElementById('keyHomNay').textContent = layKeyHomNay();
    kiemTraMayChu();
};
</script>
</body>
</html>
