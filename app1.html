<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔑Lấy Key</title>
    <style>
        *{margin:0; padding:0; box-sizing:border-box; font-family:system-ui,sans-serif;}
        body{background:linear-gradient(135deg,#0f172a,#1e293b); color:#f1f5f9; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;}
        .man-bao-tri, .man-cam{display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(15,23,42,.98); z-index:999; flex-direction:column; align-items:center; justify-content:center; padding:20px; text-align:center;}
        .hop{background:rgba(30,41,59,.95); padding:30px 20px; border-radius:16px; border:2px solid #ffcc00; max-width:400px; width:100%;}
        .hop h2{color:#ffcc00; font-size:20px; margin:15px 0;}
        .hop p{color:#cbd5e1; font-size:14px; line-height:1.6;}
        .icon{font-size:48px;}
        .btn-tai-lai{margin-top:20px; padding:10px 20px; background:#4ade80; color:#000; border:none; border-radius:8px; font-weight:bold; cursor:pointer;}
        .box{background:rgba(30,41,59,.9); padding:25px; border-radius:16px; border:2px solid #ffcc00; max-width:400px; width:100%;}
        h1{color:#ffcc00; font-size:20px; text-align:center; margin-bottom:20px;}
        .btn{width:100%; padding:14px; background:linear-gradient(135deg,#cc8800,#ffcc00); color:#000; border:none; border-radius:10px; font-weight:bold; font-size:16px; cursor:pointer;}
        .btn:disabled{background:#475569; color:#94a3b8; cursor:not-allowed;}
        .dem-nguoc{font-size:48px; font-weight:bold; color:#4ade80; margin:15px 0; text-align:center; font-family:monospace;}
        .key-box{margin-top:15px; padding:15px; background:rgba(0,0,0,.4); border-radius:10px; border:2px dashed #00ccff; display:none; text-align:center;}
        .key-hien-thi{font-size:20px; font-weight:bold; color:#00ccff; letter-spacing:2px; font-family:monospace; margin:8px 0;}
        .nhat-ky{margin-top:15px; padding:12px; background:rgba(0,0,0,.25); border-radius:10px; border:1px solid #334155;}
        .tieu{color:#facc15; font-size:13px; margin-bottom:8px; display:flex; justify-content:space-between;}
        .tieu button{background:rgba(255,68,68,.2); color:#ff6b6b; border:none; padding:3px 8px; border-radius:4px; font-size:11px; cursor:pointer;}
        .ds{font-size:11px; color:#cbd5e1; line-height:1.8; max-height:120px; overflow-y:auto;}
        .ds .rong{color:#64748b; font-style:italic;}
        .trangthai-hien{margin-top:10px; font-size:11px; color:#94a3b8;}
        .ver{font-size:10px; color:#64748b; margin-top:10px; text-align:center;}
    </style>
</head>
<body>
    <div class="man-bao-tri" id="manBaoTri">
        <div class="hop"><div class="icon">🔧</div><h2>APP 1 ĐANG BẢO TRÌ</h2><p>Vui lòng quay lại sau!</p><button class="btn-tai-lai" onclick="location.reload()">🔄 Tải lại</button></div>
    </div>
    <div class="man-cam" id="manCam">
        <div class="hop"><div class="icon">⚠️</div><h2>PHIÊN BẢN CŨ</h2><p id="txtCam">Cập nhật bản mới nhất!</p><button class="btn-tai-lai" onclick="location.reload()">🔄 Tải lại</button></div>
    </div>
    <div class="box" id="manChinh">
        <h1>🔑 NHẬN KEY MỞ APP</h1>
        <button class="btn" id="btnChinh" onclick="batDau()">🔓 NHẬN KEY NGAY</button>
        <div class="dem-nguoc" id="dem" style="display:none;">60</div>
        <div class="key-box" id="keyBox">
            <div>✅ Key Hôm Nay:</div>
            <div class="key-hien-thi" id="keyHienThi"></div>
            <div style="font-size:11px; color:#94a3b8;">Sao chép</div>
        </div>
        <div class="nhat-ky">
            <div class="tieu">📝 NHẬT KÝ<button onclick="xoaNhatKy()">Xóa</button></div>
            <div class="ds" id="dsNhatKy"><span class="rong">Chưa có lịch sử...</span></div>
        </div>
        <div class="trangthai-hien" id="trangThaiHien">🔄 Đang kiểm tra Hệ thống...</div>
        <div class="ver">Phiên bản: v1.0.1</div>
    </div>
<script>
// =============================================
// 🔧 THAY LINK TỆP TRÊN GITHUB CỦA BẠN VÀO ĐÂY!
// =============================================
const LINK_TRANG_THAI = "https://raw.githubusercontent.com/HackGame-1/Appff/main/Trangthai.txt";
const PHIEN_BAN = "v1.0.1";
const BAN_TOI_THIEU = "v1.0.0";
const BAN_CAM = "v0.9.0";
// =============================================

let dangBaoTri = false;

// === Kiểm tra trạng thái trên GitHub mỗi 5 GIÂY ===
async function kiemTraGithub() {
    try {
        const res = await fetch(LINK_TRANG_THAI + "?t=" + Date.now(), {cache: "no-store"});
        if (!res.ok) throw new Error("Lỗi kết nối");
        const text = (await res.text()).trim().toUpperCase();
        
        document.getElementById('trangThaiHien').innerHTML = 
            "📡 Trạng thái: " + (text === "KHOA" ? "🔒 Bảo trì" : "✅ Mở bình thường");

        if (text === "KHOA" && !dangBaoTri) {
            dangBaoTri = true;
            document.getElementById('manBaoTri').style.display = 'flex';
            document.getElementById('manChinh').style.display = 'none';
        }
        else if (text === "MO" && dangBaoTri) {
            dangBaoTri = false;
            document.getElementById('manBaoTri').style.display = 'none';
            document.getElementById('manChinh').style.display = 'block';
        }
    } catch {
        document.getElementById('trangThaiHien').innerHTML = "📡 Kết nối...";
    }
}

// === Kiểm tra phiên bản ===
function soSanh(a,b){const t=a.replace('v','').split('.').map(Number),u=b.replace('v','').split('.').map(Number);for(let i=0;i<3;i++){if(t[i]>u[i])return 1;if(t[i]<u[i])return-1;}return 0;}
async function kiemTraHeThong(){
    if(PHIEN_BAN===BAN_CAM||soSanh(PHIEN_BAN,BAN_TOI_THIEU)<0){
        document.getElementById('txtCam').innerHTML=`Bản hiện tại: ${PHIEN_BAN}<br>Yêu cầu: ${BAN_TOI_THIEU}`;
        document.getElementById('manCam').style.display='flex';
        document.getElementById('manChinh').style.display='none';
        return false;
    }
    return true;
}

function layKey(){const d=new Date(),n=String(d.getDate()).padStart(2,'0'),t=String(d.getMonth()+1).padStart(2,'0'),y=d.getFullYear();return`FF${n}${t}${y}VN`;}
function layGio(){const d=new Date();return`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;}

let nhatKy=[];function taiNhatKy(){const luu=localStorage.getItem('nhatKyApp1');if(luu)nhatKy=JSON.parse(luu);}
function hienNhatKy(){const box=document.getElementById('dsNhatKy');if(!nhatKy.length){box.innerHTML='<span class="rong">Chưa có lịch sử...</span>';return;}box.innerHTML=nhatKy.map((x,i)=>`<span style="color:${i===0?'#4ade80':'#cbd5e1'}">[${x.gio}] ✅ ${x.key}</span>`).join('<br>');}
function xoaNhatKy(){nhatKy=[];localStorage.removeItem('nhatKyApp1');hienNhatKy();}
function themNhatKy(key){nhatKy.unshift({gio:layGio(),key});if(nhatKy.length>20)nhatKy.pop();localStorage.setItem('nhatKyApp1',JSON.stringify(nhatKy));hienNhatKy();}

async function batDau(){
    const ok=await kiemTraHeThong();if(!ok)return;
    const btn=document.getElementById('btnChinh'),dem=document.getElementById('dem'),keyBox=document.getElementById('keyBox'),keyHienThi=document.getElementById('keyHienThi');
    btn.disabled=true;dem.style.display='block';keyBox.style.display='none';
    let t=60;dem.textContent=t;
    const demNgay=setInterval(()=>{
        t--;dem.textContent=t;
        if(t<=0){clearInterval(demNgay);dem.style.display='none';const key=layKey();keyHienThi.textContent=key;keyBox.style.display='block';themNhatKy(key);setTimeout(()=>btn.disabled=false,3000);}
    },1000);
}

// === Bắt đầu kiểm tra mỗi 5 GIÂY ===
taiNhatKy();kiemTraHeThong();
kiemTraGithub();
setInterval(kiemTraGithub, 5000); // 5000ms = 5 giây
</script>
</body>
</html>
