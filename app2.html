<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ ONESHOT (Free)</title>
    <style>
        *{margin:0; padding:0; box-sizing:border-box; font-family:system-ui,sans-serif;}
        body{background:linear-gradient(135deg,#0f172a,#1e293b); color:#f1f5f9; min-height:100vh; padding:15px;}
        .container{max-width:440px; margin:0 auto;}
        
        /* === TẦM ẢO === */
        .tam-ao{position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); pointer-events:none; z-index:9999; display:none;}
        .tam-ao.bat{display:block;}
        .tam-ao .diem{position:absolute; background:#ff0000; border-radius:50%; transform:translate(-50%,-50%);}
        .tam-ao .ngang{position:absolute; background:#ff0000; transform:translate(-50%,-50%);}
        .tam-ao .doc{position:absolute; background:#ff0000; transform:translate(-50%,-50%);}
        
        /* === Bảo trì / Cấm === */
        .man-hinh-bao-tri, .man-hinh-cam{display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(15,23,42,.98); z-index:999; flex-direction:column; align-items:center; justify-content:center; padding:20px; text-align:center;}
        .hop-thong-bao{background:rgba(30,41,59,.95); padding:30px 20px; border-radius:16px; border:2px solid #ff6b6b; max-width:400px; width:100%;}
        .hop-thong-bao.bao-tri{border-color:#facc15;}
        .hop-thong-bao h2{font-size:20px; margin-bottom:15px;}
        .hop-thong-bao.bao-tri h2{color:#facc15;}
        .hop-thong-bao.cam h2{color:#ff6b6b;}
        .hop-thong-bao p{color:#cbd5e1; font-size:14px; line-height:1.6;}
        .icon{font-size:48px; margin-bottom:10px;}
        
        /* === Khác === */
        .box{background:rgba(30,41,59,.9); padding:20px; border-radius:16px; border:2px solid #00ccff;}
        h1{color:#00ccff; font-size:19px; text-align:center; margin-bottom:18px;}
        input{width:100%; padding:13px; background:rgba(0,0,0,.3); border:2px solid #00ccff; color:#fff; border-radius:10px; font-size:17px; text-align:center; outline:none; text-transform:uppercase; margin-bottom:12px; font-family:monospace;}
        input:focus{border-color:#4ade80; box-shadow:0 0 15px rgba(74,222,128,.3);}
        .btn{width:100%; padding:13px; background:linear-gradient(135deg,#0066cc,#00ccff); color:#fff; border:none; border-radius:10px; font-weight:bold; font-size:16px; cursor:pointer; transition:.2s;}
        .btn:active{transform:scale(.97);}
        .sai{color:#ff6b6b; text-align:center; margin-top:10px; display:none; font-weight:bold; padding:8px; background:rgba(255,68,68,.1); border-radius:8px; font-size:14px;}
        .dung{color:#4ade80; text-align:center; margin-top:10px; display:none; font-weight:bold; padding:8px; background:rgba(74,222,128,.1); border-radius:8px; font-size:14px;}
        .ver{text-align:center; color:#94a3b8; font-size:10.5px; margin-top:10px; line-height:1.5;}
        
        .man-hinh-chinh{display:none; margin-top:15px;}
        .tieu-danh-sach{color:#facc15; font-size:13px; margin:10px 0 8px; padding-bottom:6px; border-bottom:1px solid rgba(250,204,21,.2);}
        .nhom-tinh-nang{display:grid; gap:7px; max-height:320px; overflow-y:auto; padding-right:5px; margin-bottom:12px;}
        .muc{background:rgba(15,23,42,.8); padding:10px 12px; border-radius:10px; border:1px solid #334155; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap;}
        .muc strong{font-size:13px; color:#e2e8f0; width:100%; margin-bottom:6px;}
        .nhan-moi{display:inline-block; background:linear-gradient(135deg,#f59e0b,#facc15); color:#78350f; font-size:8.5px; font-weight:800; padding:1px 4px; border-radius:4px; margin-left:5px; animation:nhanMoi 2s infinite;}
        @keyframes nhanMoi{0%{box-shadow:0 0 3px #facc15;}50%{box-shadow:0 0 8px #facc15;}100%{box-shadow:0 0 3px #facc15;}}
        
        .switch{position:relative; width:44px; height:24px;}
        .switch input{opacity:0; width:0; height:0; padding:0; margin:0;}
        .thanh{position:absolute; cursor:pointer; top:0; left:0; right:0; bottom:0; background:#334155; border-radius:24px; transition:.3s;}
        .thanh:before{position:absolute; content:""; height:18px; width:18px; left:3px; bottom:3px; background:#fff; border-radius:50%; transition:.3s;}
        input:checked + .thanh{background:linear-gradient(135deg,#22c55e,#4ade80); box-shadow:0 0 8px rgba(74,222,128,.35);}
        input:checked + .thanh:before{transform:translateX(20px);}
        
        .thanh-chinh{width:100%; margin-top:8px; display:flex; align-items:center; gap:8px; font-size:11px; color:#94a3b8;}
        .thanh-chinh input[type="range"]{flex:1; padding:0; margin:0;}
        .chon-mau{width:30px; height:24px; border:none; border-radius:6px; cursor:pointer; padding:0;}
        
        .nhat-ky-box{background:rgba(0,0,0,.25); padding:10px 12px; border-radius:10px; border:1px solid #1e293b; margin-top:10px;}
        .tieu-nhat-ky{color:#facc15; font-size:12px; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center;}
        .tieu-nhat-ky button{background:rgba(255,68,68,.2); color:#ff6b6b; border:none; padding:2px 8px; border-radius:4px; font-size:10px; cursor:pointer;}
        .nhat-ky-danh-sach{font-size:11px; color:#94a3b8; line-height:1.8; max-height:100px; overflow-y:auto;}
        .nhat-ky-danh-sach .rong{color:#475569; font-style:italic;}
        .phien-ban-cuoi{text-align:center; color:#64748b; font-size:9.5px; margin-top:8px; padding-top:6px; border-top:1px dashed rgba(148,163,184,.25);}
    </style>
</head>
<body>
    <div class="tam-ao" id="tamAo">
        <div class="diem" id="tamDiem"></div>
        <div class="ngang" id="tamNgang"></div>
        <div class="doc" id="tamDoc"></div>
    </div>

    <div class="man-hinh-bao-tri" id="manHinhBaoTri">
        <div class="hop bao-tri"><div class="icon">🔧</div>
            <h2>ĐANG BẢO TRÌ</h2><p>Vui lòng quay lại sau!</p>
            <button class="btn-tai-lai" onclick="location.reload()">🔄 Tải lại</button>
          </div>
        </div>
    </div>

    <div class="man-hinh-cam" id="manHinhCam">
        <div class="hop"><div class="icon">⚠️</div>
            <h2>PHIÊN BẢN ĐÃ BỊ CẤM</h2>
            <p id="thongBaoCam">Cập nhật bản mới nhất!</p>
            <button class="btn-tai-lai" onclick="location.reload()">🔄 Tải lại</button>
          </div>
        </div>
    </div>

    <div class="container">
        <div id="manHinhKey">
            <div class="box">
                <h1>🔑 NHẬP KEY</h1>
                <input type="text" id="keyInput" placeholder="FFXXXXXVN" maxlength="50">
                <button class="btn" onclick="kiemTraHeThong()">🔓 MỞ NGAY</button>
                <div class="sai" id="saiKey">❌ SAI KEY!/div>
                <div class="dung" id="dungKey">✅ ĐÚNG KEY, Đang tải giao diện....</div>
                <div class="ver">PHIÊN BẢN : v1.0.0</div>
            </div>
        </div>

        <div class="man-hinh-chinh" id="manHinhChinh">
            <div class="box">
                <h1>✅ TÍNH NĂNG</h1>
                <div class="tieu-danh-sach">📋 Nhấn công tắc → Bật/Tắt + Ghi Nhật ký</div>
                <div class="nhom-tinh-nang" id="danhSachTinhNang"></div>
                
                <div class="nhat-ky-box">
                    <div class="tieu-nhat-ky">
                        📝 NHẬT KÝ
                        <button onclick="xoaNhatKy()">Xóa hết</button>
                    </div>
                    <div class="nhat-ky-danh-sach" id="nhatKyBox">
                        <span class="rong">Chưa bật tính năng nào...</span>
                    </div>
                    <div class="phien-ban-cuoi">Phiên bản: v1.0.0</div>
                </div>
            </div>
        </div>
    </div>

<script>
// === CẤU HÌNH ===
const APP_DANG_KY = "app2"
const PHIEN_BAN_HIEN_TAI = "v1.0.0"
const SHEET_ID = "1YgjvxtzT2mvOmqlVZemQ26eC2HSI7gDIiGey3HtQHWg";
const URL_SHEET = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&range=A2:D2`;

let tamAoKichThuoc = 20, tamAoMau = "#ff0000", tamAoDaBat = false;

// === KEY ===
function layKeyDung(){
    const d=new Date(), n=String(d.getDate()).padStart(2,'0'), t=String(d.getMonth()+1).padStart(2,'0'), y=d.getFullYear();
    return `FF${n}${t}${y}VN`;
}

// === SO SÁNH BẢN ===
function soSanhPhienBan(a,b){
    const t=a.replace('v','').split('.').map(Number), u=b.replace('v','').split('.').map(Number);
    for(let i=0;i<3;i++){if(t[i]>u[i])return 1;if(t[i]<u[i])return -1;}return 0;
}

// === ĐỌC SHEET ===
async function docSheet(){
    try{
        const r=await fetch(URL_SHEET), t=await r.text(), d=JSON.parse(t.substring(47,t.length-2)), h=d.table.rows[0]?.c;
        return {trangThai:h?.[1]?.v||"MO", phienBanMin:h?.[2]?.v||"v1.0.0", phienBanCam:h?.[3]?.v||"v0.9.0"};
    }catch{return {trangThai:"MO", phienBanMin:"v1.0.0", phienBanCam:"v0.0.0"};}
}

// === KIỂM TRA ===
async function kiemTraHeThong(){
    const n=document.getElementById('keyInput').value.toUpperCase().trim(), k=layKeyDung();
    if(n!==k){document.getElementById('saiKey').style.display='block';return;}
    document.getElementById('saiKey').style.display='none'; document.getElementById('dungKey').style.display='block';
    const s=await docSheet();
    if(s.trangThai==="KHOA"){document.getElementById('manHinhBaoTri').style.display='flex';return;}
    if(PHIEN_BAN_HIEN_TAI===s.phienBanCam || soSanhPhienBan(PHIEN_BAN_HIEN_TAI,s.phienBanMin)<0){
        document.getElementById('thongBaoCam').innerHTML=`Bản hiện tại: ${PHIEN_BAN_HIEN_TAI}<br>Yêu cầu: ${s.phienBanMin}<br>Bị cấm: ${s.phienBanCam}`;
        document.getElementById('manHinhCam').style.display='flex';return;
    }
    setTimeout(()=>{document.getElementById('manHinhKey').style.display='none';document.getElementById('manHinhChinh').style.display='block';taiNhatKy();},800);
}

// === NHẬT KÝ ===
let nhatKy=[];
function capNhatNhatKy(ten,on){
    const d=new Date(), g=`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    nhatKy=nhatKy.filter(x=>!x.ten.includes(ten.slice(0,12)));
    if(on)nhatKy.unshift({gio:g,ten:ten.slice(0,25)});
    localStorage.setItem('nhatKyApp2',JSON.stringify(nhatKy));hienNhatKy();
}
function hienNhatKy(){document.getElementById('nhatKyBox').innerHTML=nhatKy.length?nhatKy.map(x=>`[${x.gio}] ✅ ${x.ten}`).join('<br>'):'<span class="rong">Chưa bật...</span>';}
function xoaNhatKy(){nhatKy=[];localStorage.removeItem('nhatKyApp2');hienNhatKy();}
function taiNhatKy(){const l=localStorage.getItem('nhatKyApp2');if(l)nhatKy=JSON.parse(l);hienNhatKy();}

// === TÂM ẢO ===
function capNhatTamAo(){
    const d=document.getElementById('tamDiem'),n=document.getElementById('tamNgang'),doc=document.getElementById('tamDoc'),t=document.getElementById('tamAo');
    if(tamAoDaBat){
        t.classList.add('bat');
        d.style.cssText='width:6px;height:6px;background:'+tamAoMau;
        n.style.cssText=`width:${tamAoKichThuoc}px;height:2px;background:${tamAoMau};margin-left:-${tamAoKichThuoc/2}px`;
        doc.style.cssText=`width:2px;height:${tamAoKichThuoc}px;background:${tamAoMau};margin-top:-${tamAoKichThuoc/2}px`;
    }else t.classList.remove('bat');
}

// ====================== DANH SÁCH ĐẦY ĐỦ 50 TÍNH NĂNG ======================
// === MUỐN HIỆN CÁI NÀO → ĐỔI "ẨN" THÀNH "HIỆN" ===
const DANH_SACH = [
    {id:'t1', ten:'⚡ Tăng Tốc & Fix Lag', trangThai:'HIỆN'},
    {id:'tam', ten:'🎯 Tầm Ảo Nâng Cấp', trangThai:'HIỆN', isTamAo:true},
    {id:'t3', ten:'🔥 Tối ưu CPU & RAM', trangThai:'HIỆN'},
    {id:'t4', ten:'❄️ Làm Mát & Ổn Định Mạng', trangThai:'HIỆN'},
    {id:'t5', ten:'🎨 Tối ưu Đồ Họa', trangThai:'HIỆN'},
    {id:'t6', ten:'📈 Tăng FPS Tối Đa', trangThai:'ẨN'},
    {id:'t7', ten:'🧹 Dọn Dẹp Bộ Nhớ', trangThai:'ẨN'},
    {id:'t8', ten:'📶 Ổn Định Tín Hiệu', trangThai:'ẨN'},
    {id:'t9', ten:'🔋 Tiết Kiệm Pin', trangThai:'ẨN'},
    {id:'t10', ten:'🖱️ Nhạy Cảm Chạm', trangThai:'ẨN'},
    {id:'t11', ten:'🔇 Tắt Hiệu Ứng Thừa', trangThai:'ẨN'},
    {id:'t12', ten:'💾 Nén Dữ Liệu Game', trangThai:'ẨN'},
    {id:'t13', ten:'🎮 Ưu Tiên CPU Cho Game', trangThai:'ẨN'},
    {id:'t14', ten:'🌐 Tối ưu Đường Truyền', trangThai:'ẨN'},
    {id:'t15', ten:'🔄 Tải Nhanh Tài Nguyên', trangThai:'ẨN'},
    {id:'t16', ten:'⚙️ Tối ưu Hệ Thống', trangThai:'ẨN'},
    {id:'t17', ten:'🎯 Tối ưu Độ Phân Giải', trangThai:'ẨN'},
    {id:'t18', ten:'🔥 Tăng Tốc Đọc/Ghi', trangThai:'ẨN'},
    {id:'t19', ten:'🧊 Giảm Nhiệt Độ CPU', trangThai:'ẨN'},
    {id:'t20', ten:'📊 Hiển Thị FPS Thực', trangThai:'ẨN'},
    {id:'t21', ten:'🛡️ Chống Giật Mạng', trangThai:'ẨN'},
    {id:'t22', ten:'🎨 Tối ưu Màu Sắc', trangThai:'ẨN'},
    {id:'t23', ten:'🔍 Tăng Độ Nét', trangThai:'ẨN'},
    {id:'t24', ten:'⚡ Tối ưu Nền', trangThai:'ẨN'},
    {id:'t25', ten:'📱 Tối ưu Màn Hình', trangThai:'ẨN'},
    {id:'t26', ten:'🎵 Tắt Âm Thanh Thừa', trangThai:'ẨN'},
    {id:'t27', ten:'🔋 Chế Độ Hiệu Năng', trangThai:'ẨN'},
    {id:'t28', ten:'🌙 Chế Độ Tối', trangThai:'ẨN'},
    {id:'t29', ten:'📉 Giảm Độ Trễ Chạm', trangThai:'ẨN'},
    {id:'t30', ten:'💡 Tối ưu Độ Sáng', trangThai:'ẨN'},
    {id:'t31', ten:'🔒 Khóa Tốc Độ CPU', trangThai:'ẨN'},
    {id:'t32', ten:'📦 Giảm Kích Thước Dữ Liệu', trangThai:'ẨN'},
    {id:'t33', ten:'🚀 Tăng Ưu Tiên Mạng', trangThai:'ẨN'},
    {id:'t34', ten:'🧹 Xóa Bộ Nhớ Đệm', trangThai:'ẨN'},
    {id:'t35', ten:'🎚️ Tối ưu Độ Nhạy', trangThai:'ẨN'},
    {id:'t36', ten:'🌡️ Cảnh Báo Nhiệt Độ', trangThai:'ẨN'},
    {id:'t37', ten:'⏱️ Tối ưu Thời Gian Phản Hồi', trangThai:'ẨN'},
    {id:'t38', ten:'📈 Tối ưu Bộ Nhớ Đệm', trangThai:'ẨN'},
    {id:'t39', ten:'🔧 Tự Sửa Lỗi Nhỏ', trangThai:'ẨN'},
    {id:'t40', ten:'📋 Thông Tin Hệ Thống', trangThai:'ẨN'},
    {id:'t41', ten:'🎛️ Tối ưu Đa Luồng', trangThai:'ẨN'},
    {id:'t42', ten:'💨 Giảm Độ Mờ', trangThai:'ẨN'},
    {id:'t43', ten:'🌈 Tối ưu Bóng Đổ', trangThai:'ẨN'},
    {id:'t44', ten:'🔊 Giảm Chất Lượng Âm Thanh', trangThai:'ẨN'},
    {id:'t45', ten:'📡 Tối ưu Dữ Liệu Nền', trangThai:'ẨN'},
    {id:'t46', ten:'🛑 Tắt Dịch Vụ Thừa', trangThai:'ẨN'},
    {id:'t47', ten:'💻 Tối ưu Độ Phân Giải', trangThai:'ẨN'},
    {id:'t48', ten:'🔁 Tải Lại Tự Động', trangThai:'ẨN'},
    {id:'t49', ten:'⚖️ Cân Bằng Hiệu Năng-Pin', trangThai:'ẨN'},
    {id:'t50', ten:'🏆 Tối ưu Tối Đa Toàn Diện', trangThai:'ẨN'}
];

// === TẠO GIAO DIỆN ===
const CONTAINER=document.getElementById('danhSachTinhNang');
DANH_SACH.forEach((t,i)=>{
    if(t.trangThai!=="HIỆN")return;
    const m=(i<3)?'<span class="nhan-moi">MỚI</span>':'',id='sw_'+t.id;
    let c='';
    if(t.isTamAo)c=`<div class="thanh-chinh">K.thước:<input type="range" min="10" max="40" value="${tamAoKichThuoc}" oninput="tamAoKichThuoc=this.value;capNhatTamAo()">Màu:<input type="color" class="chon-mau" value="${tamAoMau}" oninput="tamAoMau=this.value;capNhatTamAo()"></div>`;
    CONTAINER.insertAdjacentHTML('beforeend',`<div class="muc"><strong>${t.ten}${m}</strong><label class="switch"><input type="checkbox" id="${id}" onchange="${t.isTamAo?'tamAoDaBat=this.checked;capNhatTamAo();':'']}capNhatNhatKy('${t.ten}',this.checked)"><span class="thanh"></span></label>${c}</div>`);
});
</script>
</body>
    </html>
