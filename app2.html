<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONESHOT (PRO)</title>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
        body {background:#1a1a2e;min-height:100vh;color:#fff;padding:20px}
        .container {max-width:400px;margin:0 auto}
        h1 {text-align:center;color:#00f5d4;margin-bottom:20px;font-size:22px}
        
        .menu-title {margin:25px 0 15px;text-align:center;color:#00f5d4;font-size:18px;font-weight:bold}
        .feature-list {display:flex;flex-direction:column;gap:12px}
        .feature-item {
            background:rgba(255,255,255,0.05);border:1px solid #7b2cbf;
            border-radius:12px;padding:15px 20px;display:flex;align-items:center;justify-content:space-between
        }
        .feature-left {display:flex;align-items:center;gap:12px}
        .feature-icon {font-size:24px}
        .feature-name {font-size:15px}

        .toggle-switch {position:relative;width:52px;height:28px}
        .toggle-switch input {opacity:0;width:0;height:0}
        .toggle-slider {position:absolute;top:0;left:0;right:0;bottom:0;background:#555;border-radius:28px;transition:.3s}
        .toggle-slider:before {content:"";position:absolute;height:22px;width:22px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s}
        input:checked + .toggle-slider {background:linear-gradient(90deg,#00f5d4,#00b4a0)}
        input:checked + .toggle-slider:before {transform:translateX(24px)}

        .btn-kiemtra {background:linear-gradient(90deg,#f59e0b,#d97706);color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:14px;font-weight:bold;cursor:pointer}
        .btn-kiemtra:disabled {opacity:0.7;cursor:not-allowed}

        .popup {position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:9999;display:none}
        .popup.hien {display:flex}
        .popup-box {background:#fff;color:#000;width:90%;max-width:360px;border-radius:12px;overflow:hidden}
        .popup-header {padding:15px;font-size:18px;font-weight:bold;text-align:center}
        .popup-body {padding:20px;font-size:15px;line-height:1.6;text-align:center}
        .popup-body input {width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin-top:10px;font-size:16px}
        .popup-footer {display:flex}
        .popup-footer button {flex:1;padding:14px;border:none;font-size:16px;font-weight:bold;cursor:pointer}
        .btn-xanh {background:#22c55e;color:#fff}
        .btn-do {background:#ef4444;color:#fff}
        .btn-lienhe {background:linear-gradient(90deg,#7b2cbf,#9d4edd);color:#fff;border-radius:12px;margin-top:20px;padding:14px;border:none;font-size:16px;font-weight:bold;cursor:pointer;width:100%}
        
        .loading-spinner {display:inline-block;width:40px;height:40px;border:4px solid #ddd;border-top-color:#22c55e;border-radius:50%;animation:spin 1s linear infinite;margin:10px 0}
        @keyframes spin {to {transform:rotate(360deg)}}
    </style>
</head>
<body>

    <!-- POPUP NHẬP KEY -->
    <div class="popup hien" id="popupKey">
        <div class="popup-box">
            <div class="popup-header">🔑 Nhập Key</div>
            <div class="popup-body">
                Nhập key để kích hoạt app:<br>
                <input type="text" id="keyInput" placeholder="FREEKEY">
            </div>
            <div class="popup-footer">
                <button class="btn-xanh" id="btnXacNhan" onclick="kiemTraKey()">✅ Xác Nhận</button>
            </div>
        </div>
    </div>

    <!-- POPUP THÔNG BÁO -->
    <div class="popup" id="popupTB">
        <div class="popup-box">
            <div class="popup-header" id="tbTieuDe">Thông báo</div>
            <div class="popup-body" id="tbNoiDung"></div>
            <div class="popup-footer">
                <button class="btn-xanh" id="btnDongTB" onclick="dongTB()">✅ Đóng</button>
            </div>
        </div>
    </div>

    <div class="container">
        <h1>🔥 ONESHOT (PRO)</h1>

        <div class="menu-title">⚙️ CHỨC NĂNG - ĐỀU DÙNG ĐƯỢC</div>
        <div class="feature-list">
            <div class="feature-item">
                <div class="feature-left">
                    <span class="feature-icon">🎯</span>
                    <span class="feature-name">Nhẹ Tâm</span>
                </div>
                <label class="toggle-switch">
                    <input type="checkbox" id="cb_nhetam" disabled onchange="doiChucNang('Nhẹ Tâm', this.checked)">
                    <span class="toggle-slider"></span>
                </label>
            </div>
            <div class="feature-item">
                <div class="feature-left">
                    <span class="feature-icon">🎯</span>
                    <span class="feature-name">Tăng Tỉ Lệ Heshot</span>
                </div>
                <label class="toggle-switch">
                    <input type="checkbox" id="cb_heshot" disabled onchange="doiChucNang('Tăng Tỉ Lệ Heshot', this.checked)">
                    <span class="toggle-slider"></span>
                </label>
            </div>
            <div class="feature-item">
                <div class="feature-left">
                    <span class="feature-icon">🛡️</span>
                    <span class="feature-name">Kiểm Tra Virus</span>
                </div>
                <button class="btn-kiemtra" id="btnKiemTraVirus" disabled onclick="kiemTraVirus()">🔍 Kiểm Tra</button>
            </div>
            <div class="feature-item">
                <div class="feature-left">
                    <span class="feature-icon">🔋</span>
                    <span class="feature-name">Tối Ưu Pin</span>
                </div>
                <label class="toggle-switch">
                    <input type="checkbox" id="cb_pin" disabled onchange="doiChucNang('Tối Ưu Pin', this.checked)">
                    <span class="toggle-slider"></span>
                </label>
            </div>
            <div class="feature-item">
                <div class="feature-left">
                    <span class="feature-icon">⚡</span>
                    <span class="feature-name">Tối Ưu FPS</span>
                </div>
                <label class="toggle-switch">
                    <input type="checkbox" id="cb_fps" disabled onchange="doiChucNang('Tối Ưu FPS', this.checked)">
                    <span class="toggle-slider"></span>
                </label>
            </div>
            <div class="feature-item">
                <div class="feature-left">
                    <span class="feature-icon">🎨</span>
                    <span class="feature-name">Tối Ưu Đồ Họa</span>
                </div>
                <label class="toggle-switch">
                    <input type="checkbox" id="cb_dohoa" disabled onchange="doiChucNang('Tối Ưu Đồ Họa', this.checked)">
                    <span class="toggle-slider"></span>
                </label>
            </div>
            <div class="feature-item">
                <div class="feature-left">
                    <span class="feature-icon">🎮</span>
                    <span class="feature-name">Tối Ưu Game</span>
                </div>
                <label class="toggle-switch">
                    <input type="checkbox" id="cb_game" disabled onchange="doiChucNang('Tối Ưu Game', this.checked)">
                    <span class="toggle-slider"></span>
                </label>
            </div>
            <div class="feature-item">
                <div class="feature-left">
                    <span class="feature-icon">📱</span>
                    <span class="feature-name">Tối Ưu Thiết Bị</span>
                </div>
                <label class="toggle-switch">
                    <input type="checkbox" id="cb_thietbi" disabled onchange="doiChucNang('Tối Ưu Thiết Bị', this.checked)">
                    <span class="toggle-slider"></span>
                </label>
            </div>
            <div class="feature-item">
                <div class="feature-left">
                    <span class="feature-icon">🎯</span>
                    <span class="feature-name">Tối Ưu Tâm Game</span>
                </div>
                <label class="toggle-switch">
                    <input type="checkbox" id="cb_tamgame" disabled onchange="doiChucNang('Tối Ưu Tâm Game', this.checked)">
                    <span class="toggle-slider"></span>
                </label>
            </div>
            <div class="feature-item">
                <div class="feature-left">
                    <span class="feature-icon">🛡️</span>
                    <span class="feature-name">Chống Bug</span>
                </div>
                <label class="toggle-switch">
                    <input type="checkbox" id="cb_bug" checked disabled onchange="doiChucNang('Chống Bug', this.checked)">
                    <span class="toggle-slider"></span>
                </label>
            </div>
        </div>

        <button class="btn-lienhe" onclick="lienHe()">📩 LIÊN HỆ</button>
    </div>

    <script>
        let daKichHoat = false;
        const KEY_DUNG = "FREEKEY";

        function kiemTraKey() {
            const key = document.getElementById('keyInput').value.trim();
            if (!key) { hienTB('❌ Thiếu Key', 'Vui lòng nhập key!'); return; }
            if (key !== KEY_DUNG) { hienTB('❌ Sai Key', 'Key không đúng!<br>Nhập: <b>FREEKEY</b>'); return; }
            
            const btnXacNhan = document.getElementById('btnXacNhan');
            btnXacNhan.disabled = true;
            btnXacNhan.textContent = '⏳ Đang xác minh...';
            
            setTimeout(() => {
                btnXacNhan.textContent = '✅ Xác Nhận';
                btnXacNhan.disabled = false;
                
                daKichHoat = true;
                document.querySelectorAll('.feature-item input').forEach(cb => cb.disabled = false);
                document.getElementById('btnKiemTraVirus').disabled = false;
                document.getElementById('popupKey').classList.remove('hien');
                
                // === THÔNG BÁO 1: KẾT NỐI THÀNH CÔNG ===
                hienTB('✅ Kết Nối Thành Công!', 'Đã kết nối với hệ thống thành công!');
                
                // === THÔNG BÁO 2: CHÀO MỪNG - LUÔN HIỆN ===
                setTimeout(() => {
                    hienTB('🎉 CHÀO MỪNG!', 'Been mình vừa ra app premium á bạn nào muốn thì liên hệ mình nhé qua phở bò');
                }, 2000);
            }, 2000);
        }

        function doiChucNang(ten, trangThai) {
            if (!daKichHoat) {
                hienTB('⚠️ Chưa Kích Hoạt', 'Nhập key: <b>FREEKEY</b> trước nhé!');
                setTimeout(() => document.getElementById('popupKey').classList.add('hien'), 500);
                return;
            }
            const tt = trangThai ? '✅ Đã Bật' : '❌ Đã Tắt';
            let them = '';
            if (ten === 'Nhẹ Tâm' && trangThai) them = '<br>🎯 Tâm nhạy hơn, dễ bắn hơn!';
            if (ten === 'Tăng Tỉ Lệ Heshot' && trangThai) them = '<br>🎯 Tăng tỉ lệ bắn lên đầu lên cao!';
            if (ten === 'Tối Ưu FPS' && trangThai) them = '<br>⚡ Game mượt hơn, giảm giật lag!';
            if (ten === 'Tối Ưu Pin' && trangThai) them = '<br>🔋 Tiết kiệm pin, chơi lâu hơn!';
            hienTB(`${tt} ${ten}`, `${tt} ${ten}!${them}`);
        }

        function kiemTraVirus() {
            if (!daKichHoat) {
                hienTB('⚠️ Chưa Kích Hoạt', 'Nhập key: <b>FREEKEY</b> trước nhé!');
                setTimeout(() => document.getElementById('popupKey').classList.add('hien'), 500);
                return;
            }
            
            const btn = document.getElementById('btnKiemTraVirus');
            btn.disabled = true;
            btn.textContent = '⏳ Đang kiểm tra...';
            
            hienTBWithLoading('🔍 Đang Kiểm Tra...', 'Đang quét toàn bộ tệp và ứng dụng...<br>Vui lòng chờ!');
            
            setTimeout(() => {
                const coVirus = Math.random() < 0.3;
                if (coVirus) {
                    hienTBResult('⚠️ PHÁT HIỆN NGUY HIỂM!', 'Phát hiện tệp đáng ngờ trên thiết bị!<br>Khuyến nghị xóa ngay để đảm bảo an toàn!', 'btn-do', '🚨 Cảnh báo');
                } else {
                    hienTBResult('✅ AN TOÀN!', 'Không phát hiện virus hoặc phần mềm độc hại trên thiết bị!<br>Thiết bị của bạn đang được bảo vệ tốt!', 'btn-xanh', '✅ Đóng');
                }
                btn.disabled = false;
                btn.textContent = '🔍 Kiểm Tra';
            }, 2500);
        }

        function hienTB(tieuDe, noiDung, nutText='✅ Đóng') {
            document.getElementById('tbTieuDe').textContent = tieuDe;
            document.getElementById('tbNoiDung').innerHTML = noiDung;
            const btn = document.getElementById('btnDongTB');
            btn.className = 'btn-xanh';
            btn.textContent = nutText;
            btn.disabled = false;
            document.getElementById('popupTB').classList.add('hien');
        }

        function hienTBWithLoading(tieuDe, noiDung) {
            document.getElementById('tbTieuDe').textContent = tieuDe;
            document.getElementById('tbNoiDung').innerHTML = `${noiDung}<div class="loading-spinner"></div>`;
            const btn = document.getElementById('btnDongTB');
            btn.className = 'btn-xanh';
            btn.textContent = '⏳ Đang kiểm tra...';
            btn.disabled = true;
            document.getElementById('popupTB').classList.add('hien');
        }

        function hienTBResult(tieuDe, noiDung, btnClass, btnText) {
            document.getElementById('tbTieuDe').textContent = tieuDe;
            document.getElementById('tbNoiDung').innerHTML = noiDung;
            const btn = document.getElementById('btnDongTB');
            btn.className = btnClass;
            btn.textContent = btnText;
            btn.disabled = false;
        }

        function dongTB() {
            document.getElementById('popupTB').classList.remove('hien');
        }

        function lienHe() {
            hienTB('📩 LIÊN HỆ', 'FACEBOOK: https://www.facebook.com/share/1L7x6Kgwet/');
        }
    </script>
</body>
</html>
